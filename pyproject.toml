[project]
name = "jobhound"
version = "0.1.0"
description = "Agente de busca de vagas compatíveis com o perfil (Clean Architecture + DDD)"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "typer>=0.12",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "beautifulsoup4>=4.12",
    "langchain-core>=1.5",
    "langchain-ollama>=1.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
dev = ["behave>=1.2.6", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
jobhound = "src.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["src*"]
